# 🚀 Release — builds the Windows and Linux installers and attaches them to
# the GitHub Release for the pushed tag (e.g. `v0.1.0`).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 🐧 Linux (.deb · .rpm · .AppImage)
            os: ubuntu-22.04
          - name: 🪟 Windows (.msi · .exe)
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 📦 Linux system libraries (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 🎨 Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build installers and upload them to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: "VPS Files ${{ github.ref_name }}"
          releaseDraft: false
          # Must be a full release: /releases/latest/download/* (the README
          # buttons) ignores pre-releases.
          prerelease: false

      # Versionless copies so README buttons can point at
      # /releases/latest/download/<name> and start the download directly.
      - name: 🔗 Upload stable download names
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          b=target/release/bundle
          mkdir -p stable
          if [ "$RUNNER_OS" = "Windows" ]; then
            exe=( "$b"/nsis/*-setup.exe ); msi=( "$b"/msi/*.msi )
            cp "${exe[0]}" stable/VPS-Files-setup-x64.exe
            cp "${msi[0]}" stable/VPS-Files-x64.msi
          else
            deb=( "$b"/deb/*.deb ); rpm=( "$b"/rpm/*.rpm ); app=( "$b"/appimage/*.AppImage )
            cp "${deb[0]}" stable/VPS-Files-amd64.deb
            cp "${rpm[0]}" stable/VPS-Files-x86_64.rpm
            cp "${app[0]}" stable/VPS-Files-x86_64.AppImage
          fi
          gh release upload "$TAG" stable/* --clobber
