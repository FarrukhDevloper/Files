# 🧪 CI — type-check, lint and test on every push, on Linux and Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 🐧 Linux
            os: ubuntu-22.04
          - name: 🪟 Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 📦 Linux system libraries (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: 🎨 Frontend — install, type-check, build
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build

      - name: 🦀 Rust — clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: ✅ Rust — tests
        run: cargo test --workspace
